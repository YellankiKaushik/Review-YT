name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: "This reference project has no guaranteed support timeline. Do not include credentials, private comment data or account information."
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended user
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
      description: Describe scope, privacy, cost and how it could be verified offline.
    validations:
      required: true
