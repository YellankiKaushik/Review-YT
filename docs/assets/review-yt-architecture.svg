<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc"><title id="title">Review-YT architecture</title><desc id="desc">Browser through Next server relay to authenticated Flask and the independent core, with official YouTube data, VADER, optional AI and SQLite cache. Secrets stay on servers.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#62758d"/></marker></defs><rect width="1200" height="510" rx="24" fill="#f6f8fc"/><g font-family="Arial,sans-serif"><text x="48" y="55" font-size="26" font-weight="bold" fill="#14263e">From public comments to a transparent review</text><text x="48" y="82" font-size="14" fill="#52647a">Server-only authentication · bounded retrieval · temporary cache · optional AI</text><rect x="48" y="140" width="190" height="95" rx="15" fill="#fff" stroke="#cbd8e4"/><text x="66" y="177" font-size="18" font-weight="bold" fill="#14263e">Browser</text><text x="66" y="204" font-size="13" fill="#52647a">Typed, labeled results</text><rect x="310" y="140" width="240" height="95" rx="15" fill="#e9f4f0" stroke="#cbd8e4"/><text x="328" y="177" font-size="18" font-weight="bold" fill="#14263e">Next.js · Vercel</text><text x="328" y="204" font-size="13" fill="#52647a">UI + server-side relay</text><rect x="625" y="140" width="240" height="95" rx="15" fill="#e9f4f0" stroke="#cbd8e4"/><text x="643" y="177" font-size="18" font-weight="bold" fill="#14263e">Flask · Render</text><text x="643" y="204" font-size="13" fill="#52647a">Waitress + validation</text><rect x="938" y="140" width="214" height="95" rx="15" fill="#fff" stroke="#cbd8e4"/><text x="956" y="177" font-size="18" font-weight="bold" fill="#14263e">Independent core</text><text x="956" y="204" font-size="13" fill="#52647a">YouTube + VADER</text><rect x="48" y="340" width="230" height="95" rx="15" fill="#eef2f9" stroke="#cbd8e4"/><text x="66" y="377" font-size="18" font-weight="bold" fill="#14263e">SQLite cache</text><text x="66" y="404" font-size="13" fill="#52647a">Source / result TTLs</text><rect x="390" y="340" width="235" height="95" rx="15" fill="#fff" stroke="#cbd8e4"/><text x="408" y="377" font-size="18" font-weight="bold" fill="#14263e">Official YouTube API</text><text x="408" y="404" font-size="13" fill="#52647a">Real metadata + comments</text><rect x="735" y="340" width="235" height="95" rx="15" fill="#fff" stroke="#cbd8e4"/><text x="753" y="377" font-size="18" font-weight="bold" fill="#14263e">Optional AI provider</text><text x="753" y="404" font-size="13" fill="#52647a">Separate research notes</text><g fill="none" stroke="#62758d" stroke-width="2" marker-end="url(#arrow)"><path d="M238 187H307"/><path d="M550 187H622"/><path d="M865 187H935"/><path d="M745 235V282H163V337"/><path d="M1045 235V305H508V337"/><path d="M1045 235V305H853V337"/></g><text x="610" y="470" text-anchor="middle" font-size="13" fill="#52647a">Cache checked before fresh analysis. Optional inference failure preserves VADER sentiment.</text><text x="610" y="493" text-anchor="middle" font-size="12" fill="#52647a">Production baseline: sentiment only. Local Ollama is a development-only option.</text></g></svg>